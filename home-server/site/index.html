<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的测试站点</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f5f6f8; color: #1f2430; line-height: 1.7;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #fff; border: 1px solid #e6e8ec; border-radius: 16px;
    max-width: 620px; width: 100%; padding: 40px 40px 32px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: #e8f7f0; color: #0f7a4d; font-size: 13px;
    padding: 6px 12px; border-radius: 999px; font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #1dbf73; }
  h1 { font-size: 28px; margin: 20px 0 8px; letter-spacing: -0.5px; }
  .sub { color: #6b7280; font-size: 15px; margin-bottom: 28px; }
  .rows { border-top: 1px solid #eef0f3; }
  .row {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 14px 0; border-bottom: 1px solid #eef0f3; font-size: 14px;
  }
  .row .k { color: #6b7280; }
  .row .v { font-weight: 600; text-align: right; word-break: break-all; }
  footer { margin-top: 24px; color: #9aa0aa; font-size: 12px; text-align: center; }
  code { background: #f2f3f5; padding: 2px 6px; border-radius: 5px; font-size: 13px; }
</style>
</head>
<body>
  <div class="card">
    <span class="badge"><span class="dot"></span> 服务运行中</span>
    <h1>我的测试站点</h1>
    <p class="sub">这台电脑已作为服务器接入公网，用于低成本测试。访问量上升后会迁移到正式服务器。</p>
    <div class="rows">
      <div class="row"><span class="k">本机时间</span><span class="v" id="clock">加载中…</span></div>
      <div class="row"><span class="k">访问者 IP</span><span class="v" id="ip">—</span></div>
      <div class="row"><span class="k">当前页面</span><span class="v" id="url">—</span></div>
      <div class="row"><span class="k">状态</span><span class="v">正常</span></div>
    </div>
    <footer>Powered by 本机 + Cloudflare Tunnel</footer>
  </div>
  <script>
    function tick() {
      document.getElementById('clock').textContent = new Date().toLocaleString('zh-CN', {hour12:false});
    }
    tick(); setInterval(tick, 1000);
    document.getElementById('url').textContent = location.href;
    fetch('/api/info').then(r => r.json()).then(d => {
      document.getElementById('ip').textContent = d.ip || '未知';
    }).catch(() => { document.getElementById('ip').textContent = '不可用'; });
  </script>
</body>
</html>
